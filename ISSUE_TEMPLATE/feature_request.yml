name: "\U0001F4A1 Feature request"
description: Suggest a new feature or tool for this project
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! If this is more of an open-ended idea than a concrete feature, consider posting in [Discussions → Ideas](https://github.com/orgs/open-source-club-alpha/discussions/categories/ideas) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing, or what's currently hard to do?
      placeholder: "I want to be able to... but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to work on this yourself?
      options:
        - label: I'd like to submit a PR for this feature
          required: false
